    function drawBarChart(canvasId, labels, values, barColor) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      if (!labels || labels.length === 0) {
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px Inter, system-ui, sans-serif';
        const emptyMsg = 'Keine Daten \u2013 bitte Zeitraum w\u00e4hlen und \u201eDaten ziehen\u201c klicken';
        const msgWidth = ctx.measureText(emptyMsg).width;
        const x = Math.max(10, Math.floor(width / 2 - msgWidth / 2));
        const y = Math.floor(height / 2);
        ctx.fillText(emptyMsg, x, y);
        return;
      }

      const maxValue = Math.max(...values, 1);
      const left = 40, top = 20, chartW = width - 60, chartH = height - 60;
      const barW = Math.max(16, Math.floor(chartW / labels.length) - 10);

      ctx.strokeStyle = '#d1d5db';
      ctx.beginPath();
      ctx.moveTo(left, top + chartH);
      ctx.lineTo(left + chartW, top + chartH);
      ctx.stroke();

      labels.forEach((label, i) => {
        const val = values[i] || 0;
        const h = Math.round((val / maxValue) * (chartH - 10));
        const x = left + i * (barW + 10) + 4;
        const y = top + chartH - h;

        ctx.fillStyle = barColor;
        ctx.fillRect(x, y, barW, h);

        ctx.fillStyle = '#111827';
        ctx.font = '11px Arial';
        const shortLabel = label.length > 16 ? label.slice(0, 16) + '…' : label;
        ctx.fillText(shortLabel, x, top + chartH + 14);
        ctx.fillText(String(Math.round(val * 100) / 100), x, y - 4);
      });
    }

    function wireAnalyticsDateRange() {
      const fromDateInput = document.getElementById('analyticsFromDate');
      const toDateInput = document.getElementById('analyticsToDate');
      const preset = document.getElementById('analyticsLookbackPreset');
      if (!fromDateInput || !toDateInput) return;


      const applyPreset = () => {
        if (!preset || !preset.value || preset.value === 'custom') return;
        const days = Number(preset.value);
        if (!Number.isFinite(days) || days <= 0) return;
        const now = new Date();
        const from = new Date(now);
        from.setDate(now.getDate() - days);
        const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        fromDateInput.value = iso(from);
        toDateInput.value = iso(now);
      };
      const normalize = () => {
        if (fromDateInput.value && !toDateInput.value) toDateInput.value = fromDateInput.value;
        if (toDateInput.value && !fromDateInput.value) fromDateInput.value = toDateInput.value;
        if (fromDateInput.value && toDateInput.value && fromDateInput.value > toDateInput.value) {
          toDateInput.value = fromDateInput.value;
        }
      };

      const trigger = () => {
        normalize();
        fetchAnalyticsData();
      };

      fromDateInput.addEventListener('focus', () => {
        if (!fromDateInput.value && toDateInput.value) fromDateInput.value = toDateInput.value;
      });
      toDateInput.addEventListener('focus', () => {
        if (!toDateInput.value && fromDateInput.value) toDateInput.value = fromDateInput.value;
      });

      fromDateInput.addEventListener('change', () => { if (preset) preset.value = 'custom'; trigger(); });
      toDateInput.addEventListener('change', () => { if (preset) preset.value = 'custom'; trigger(); });
      if (preset) preset.addEventListener('change', () => { applyPreset(); trigger(); });
    }

    async function fetchAnalyticsData() {
      const status = document.getElementById('analyticsStatus');
      const select = document.getElementById('analyticsSinceSelect');
      const fromDateInput = document.getElementById('analyticsFromDate');
      const toDateInput = document.getElementById('analyticsToDate');
      if (!status || !select) return;
      try {
        const fromDate = fromDateInput ? fromDateInput.value : '';
        const toDate = toDateInput ? toDateInput.value : '';
        if (fromDate && toDate) {
          const diffDays = Math.round((new Date(toDate) - new Date(fromDate)) / 86400000);
          if (diffDays > 180) {
            const proceed = window.confirm(`Du lädst einen Zeitraum von ${diffDays} Tagen. Das kann je nach API sehr lange dauern. Fortfahren?`);
            if (!proceed) { status.textContent = 'Auswertung abgebrochen.'; return; }
          }
        }
        status.textContent = 'Lade Auswertungsdaten...';
        const data = await apiPost('/api/analytics/fetch', {
          sinceId: select.value || '0',
          fromDate,
          toDate
        });
        renderAnalytics(data);
        const count = (data.summary && data.summary.paymentsCount) || 0;
        status.textContent = `Auswertung geladen (${count} Zahlläufe).`;
        const advisorStatus = document.getElementById('analyticsAdvisorStatus');
        if (advisorStatus) advisorStatus.textContent = 'Bitte Beraterin auswählen und 360° laden.';
      } catch (error) {
        status.textContent = `Fehler beim Laden der Auswertung: ${error.message}`;
      }
    }

    async function pollOnce() {
      const status = document.getElementById('pollStatus');
      try {
        const sinceSelect = document.getElementById('lastImportedSelect');
        const data = await apiPost('/api/provisionen-goaffpro/poll', { sinceId: sinceSelect ? (sinceSelect.value || '0') : '0' });
        await loadMailLog();
        if (Array.isArray(data.payments) && data.payments.length > 0) {

        updateCommissionSelect(data.lastImportedComissionHistory, data.lastImportedComission, data.commissionHistoryLabels);
        renderCommissionHistoryEditor(data.lastImportedComissionHistory, data.commissionHistoryLabels);
        status.textContent = data.message || 'Polling erfolgreich.';
      } catch (error) {
        status.textContent = `Fehler beim Polling: ${error.message}`;
      }
    }

      function openSidebar() {
        sideNav.classList.add('side-nav-open');
        if (overlay) overlay.classList.add('active');
        hamburger.setAttribute('aria-label', 'Navigation schliessen');
        hamburger.innerHTML = '&#10005;';
      }

      function closeSidebar() {
        sideNav.classList.remove('side-nav-open');
        if (overlay) overlay.classList.remove('active');
        hamburger.setAttribute('aria-label', 'Navigation öffnen');
        hamburger.innerHTML = '&#9776;';
      }

      hamburger.addEventListener('click', function() {
        if (sideNav.classList.contains('side-nav-open')) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      sideNav.addEventListener('click', function(e) {
        if (e.target.closest('.side-nav-item')) {
          if (window.innerWidth < 768) {
            closeSidebar();
          }
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && sideNav.classList.contains('side-nav-open')) {
          closeSidebar();
        }
      });
    }

    function renderAreaTabs() { renderSideNav(); }
