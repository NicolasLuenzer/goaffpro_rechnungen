<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VEMMiNA Assistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <style>
    /* ── Design Tokens (VEMMiNA-Farbwelt: Pastellblau, Tannengrün, Altrosa, Gold) ── */
    :root {
      --clr-bg: #f4f6f7;
      --clr-surface: #ffffff;
      --clr-sidebar: #2d4a5e;
      --clr-sidebar-hover: #eef5f9;
      --clr-sidebar-active: #dcebf4;
      --clr-accent-1: #6fa3c4;
      --clr-accent-2: #108474;
      --clr-accent-3: #e9b949;
      --clr-accent-4: #d499a2;
      --clr-danger: #d05353;
      --clr-text: #26282a;
      --clr-muted: #5b6771;
      --clr-border: #e4eaee;
      --clr-border-strong: #b8cfdf;
      --clr-surface-light: #eaf3f9;
      --clr-surface-tint: #f8fafb;
      --clr-border-medium: #cfdfe9;
      --clr-accent-1b: #55809e;
      --clr-accent-2-end: #0c6a5d;
      --clr-accent-4-end: #c07f8a;
      --clr-danger-end: #b83e3e;
      --clr-accent-3-end: #d8a419;
      --clr-accent-4-dark: #a96874;
      --clr-text-code: #26282a;
      --clr-border-neutral: #e4e8eb;
      --clr-success: #0b6355;
      --clr-success-bg: #e3f4f1;
      --clr-success-border: #9fd6cb;
      --clr-warn: #8a6212;
      --clr-warn-bg: #fdf3d7;
      --clr-warn-border: #f0d089;
      --clr-error: #9c3c3c;
      --clr-error-bg: #fbeaea;
      --clr-error-border: #eec4c4;
      --clr-info: #2d5f7e;
      --clr-info-hover: #234d66;
      --clr-info-bg: #eaf3f9;
      --clr-info-border: #a8cadd;
      --clr-focus-ring: rgba(111,163,196,.28);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(38,40,42,.05);
      --shadow-md: 0 4px 14px rgba(38,40,42,.07);
      --shadow-lg: 0 10px 30px rgba(38,40,42,.12);
      --fs-sm: 12px;
      --fs-body: 14px;
      --fs-sub: 18px;
      --fs-heading: 24px;
    }

    /* ── Base ── */
    body { font-family: 'Poppins', 'Inter', system-ui, sans-serif; margin: 0; padding: 20px; background: var(--clr-bg); background-image: radial-gradient(ellipse at 15% 40%, rgba(111,163,196,.08) 0%, transparent 55%), radial-gradient(ellipse at 85% 15%, rgba(212,153,162,.06) 0%, transparent 50%); color: var(--clr-text); min-height: 100vh; }
    h1 { margin: 0; font-size: var(--fs-heading); font-weight: 700; color: var(--clr-text); }
    h2 { color: var(--clr-text); }
    :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--clr-focus-ring); }

    /* ── Header ── */
    .app-header { display:flex; align-items:center; gap:14px; margin-bottom: 20px; background: var(--clr-surface); border-bottom: 3px solid var(--clr-accent-1); border-radius: var(--radius-lg); padding: 14px 20px; box-shadow: var(--shadow-md); }
    .app-brand { display:flex; align-items:center; gap:14px; padding-right:6px; }
    .app-brand-divider { width:1px; height:36px; background:var(--clr-border); display:inline-block; }
    .app-logo { height: 40px; width: auto; }
    .app-logo-wordmark { height: 34px; }
    .app-logo-round { height: 42px; }
    .app-subtitle { margin: 3px 0 0; color: var(--clr-muted); font-size: var(--fs-body); font-weight: 500; }
    .header-spacer { flex:1; }
    .header-btn { background: var(--clr-surface-light) !important; color: var(--clr-info) !important; border: 1.5px solid var(--clr-border-strong) !important; font-family: inherit; }
    .header-btn:hover { background: var(--clr-sidebar-active) !important; transform: translateY(-1px); box-shadow: var(--shadow-sm) !important; }

    /* ── Login Overlay ── */
    .login-overlay { position:fixed; inset:0; background:rgba(38,40,42,.55); backdrop-filter:blur(8px); z-index:5000; display:none; align-items:center; justify-content:center; }
    .login-card { width:min(420px,94vw); background:var(--clr-surface); border:1.5px solid var(--clr-border-strong); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow-lg); }

    /* ── Area Tabs ── */
    .area-tabs { display:flex; gap:8px; margin-bottom:12px; }
    .area-panel { display:none; }
    .area-panel.active { display:block; }

    /* ── Main Tabs ── */
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab { border: 1.5px solid var(--clr-border-strong); border-radius: 99px; padding: 8px 20px; background: var(--clr-surface); color: var(--clr-info); font-weight: 600; font-size: var(--fs-body); cursor: pointer; transition: all .18s ease; font-family: inherit; }
    .tab:hover { background: var(--clr-surface-light); border-color: var(--clr-accent-1); transform: translateY(-1px); }
    .tab.active { background: var(--clr-info); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(45,95,126,.28); }

    /* ── Panels ── */
    .panel { display: none; border: 1px solid var(--clr-border); border-radius: var(--radius-lg); background: var(--clr-surface); padding: 20px; box-shadow: var(--shadow-sm); }
    .panel.active { display: block; }
    .status { margin: 12px 0; color: var(--clr-muted); font-size: var(--fs-body); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }

    /* ── Settings ── */
    .settings { margin: 12px 0; padding: 16px; border: 1px solid var(--clr-border); border-radius: var(--radius-md); background: var(--clr-surface-tint); }
    .settings-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(520px,1fr)); gap:16px; }
    .settings-group { border:1px solid var(--clr-border); border-radius:var(--radius-md); background:var(--clr-surface); padding:16px; box-shadow: var(--shadow-sm); }
    .settings-group h3 { margin:0 0 10px; font-size:var(--fs-sub); color:var(--clr-info); font-weight:700; }
    .settings-hint { color:var(--clr-muted); font-size:var(--fs-sm); margin-top:6px; line-height:1.5; }

    /* ── Inputs ── */
    input[type="text"], input[type="email"], input[type="number"], select { min-width: 420px; padding: 9px 12px; border: 1.5px solid var(--clr-border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: var(--fs-body); color: var(--clr-text); background: var(--clr-surface); transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus { outline: none; border-color: var(--clr-accent-1); box-shadow: 0 0 0 3px var(--clr-focus-ring); }

    /* ── Buttons ── */
    button { background: var(--clr-info); color: white; border: 1.5px solid transparent; border-radius: var(--radius-sm); padding: 10px 16px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: var(--fs-body); transition: all .18s ease; }
    button:hover { transform: translateY(-1px); background: var(--clr-info-hover); box-shadow: 0 4px 12px rgba(45,95,126,.28); }
    button.secondary { background: var(--clr-surface-light); color: var(--clr-info); border-color: var(--clr-border-strong); }
    button.secondary:hover { background: var(--clr-sidebar-active); box-shadow: var(--shadow-sm); }
    button.danger { background: var(--clr-danger); }
    button.danger:hover { background: var(--clr-danger-end); box-shadow: 0 4px 12px rgba(208,83,83,.35); }
    button:disabled { background: #e2e6e9; color: #9aa4ad; border-color: transparent; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: none; border-bottom: 1px solid var(--clr-border); padding: 9px 12px; text-align: left; font-size: var(--fs-body); }
    th { background: var(--clr-surface-light); cursor: pointer; user-select: none; font-weight: 700; color: var(--clr-info); border-bottom: 2px solid var(--clr-border-strong); }
    th:first-child { border-top-left-radius: var(--radius-sm); }
    th:last-child { border-top-right-radius: var(--radius-sm); }
    th.sort-active { background: var(--clr-sidebar-active); }
    tr:nth-child(even) td { background: var(--clr-surface-tint); }
    tr:hover td { background: var(--clr-surface-light) !important; transition: background .1s; }

    /* ── Files ── */
    .files { margin-top: 8px; font-size: var(--fs-body); color: var(--clr-text); }

    /* ── Pills ── */
    .pill-list { display:flex; flex-wrap:wrap; gap:8px; margin: 8px 0; }
    .pill { display:inline-flex; align-items:center; gap:6px; background:var(--clr-surface-light); color:var(--clr-sidebar); border:1.5px solid var(--clr-border-strong); border-radius:999px; padding:5px 12px; font-size:var(--fs-sm); font-weight:600; }
    .pill button { padding:2px 8px; font-size:var(--fs-sm); background:var(--clr-danger); border-radius:99px; }

    /* ── Warning ── */
    .warning-banner { margin: 10px 0; padding: 12px 16px; border: 1.5px solid var(--clr-error-border); border-left-width: 4px; background: var(--clr-error-bg); color: var(--clr-error); border-radius: var(--radius-sm); font-weight: 600; }
    .recipient-advisor-label { color: var(--clr-text); font-weight: 700; }
    .text-error { color: var(--clr-error); }
    .text-warn { color: var(--clr-warn); }
    tr.row-warning td { background: #fdf4f4 !important; }

    /* ── Version Badge ── */
    .app-version { align-self: center; margin-left: 10px; background: var(--clr-info); color: #fff; padding: 6px 14px; border-radius: 99px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); font-family: inherit; white-space: nowrap; }
    .version-popup { position: fixed; top: 52px; right: 18px; width: 460px; max-height: 360px; overflow: auto; background: var(--clr-surface); border: 1.5px solid var(--clr-border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 1001; padding: 14px; }
    .version-popup-header { font-weight: 700; margin-bottom: 8px; color: var(--clr-info); }
    .version-popup ul { margin: 0; padding-left: 18px; }
    .version-popup li { margin-bottom: 8px; font-size: var(--fs-body); }

    /* ── Request Preview ── */
    .request-preview { margin: 10px 0; padding: 12px; border: 1px solid var(--clr-border); border-radius: var(--radius-sm); background: var(--clr-surface-tint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-sm); color: var(--clr-text-code); word-break: break-all; }

    /* ── Section Tabs ── */
    .section-tabs { display: flex; justify-content: flex-end; gap: 8px; margin: 8px 0 14px; }
    .section-tab { border: 1.5px solid var(--clr-border-strong); border-radius: 99px; padding: 7px 16px; background: var(--clr-surface); color: var(--clr-info); font-weight: 600; font-size: var(--fs-body); cursor: pointer; transition: all .15s; font-family: inherit; }
    .section-tab:hover { background: var(--clr-surface-light); }
    .section-tab.active { background: var(--clr-info); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(45,95,126,.25); }
    .section-panel { display: none; }
    .section-panel.active { display: block; }

    /* ── Help ── */
    .help-doc { white-space: pre-wrap; background:var(--clr-surface-tint); border:1px solid var(--clr-border); border-radius:var(--radius-sm); padding:16px; font-size:var(--fs-body); line-height:1.6; }
    .help-sections details { border:1px solid var(--clr-border); border-radius:var(--radius-sm); margin:8px 0; background:var(--clr-surface); }
    .help-sections summary { cursor:pointer; padding:12px 14px; font-weight:700; color:var(--clr-info); }
    .help-sections .help-section-body { padding:0 14px 14px; white-space:pre-wrap; }

    /* ── Advisor Link & Hover Card ── */
    .advisor-name-link { color:var(--clr-accent-2); cursor:pointer; text-decoration:underline dotted; }
    .advisor-hover-card { position:fixed; z-index:2000; max-width:360px; background:var(--clr-surface); border:1.5px solid var(--clr-border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:14px; font-size:var(--fs-sm); line-height:1.5; }
    .advisor-hover-card::after { content:""; position:absolute; left:20px; bottom:-8px; width:14px; height:14px; background:#fff; border-right:1.5px solid var(--clr-border-strong); border-bottom:1.5px solid var(--clr-border-strong); transform:rotate(45deg); }

    /* ── Save Button States ── */
    .save-btn-idle { background:var(--clr-sidebar-active) !important; color:var(--clr-info) !important; }
    .save-btn-dirty { background:var(--clr-accent-2) !important; color:#fff !important; }

    /* ── Validation Subtabs ── */
    .validation-subtabs { display:flex; gap:8px; margin-bottom:14px; }
    .validation-subtab { border:1.5px solid var(--clr-border-strong); border-radius:99px; padding:7px 16px; background:var(--clr-surface); color:var(--clr-info); font-weight:600; font-size:var(--fs-body); cursor:pointer; transition: all .15s; font-family: inherit; }
    .validation-subtab:hover { background: var(--clr-surface-light); }
    .validation-subtab.active { background:var(--clr-info); color:#fff; border-color:transparent; box-shadow: 0 2px 8px rgba(45,95,126,.25); }
    .validation-section { display:none; }
    .validation-section.active { display:block; }

    /* ── Tree ── */
    .tree-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
    .tree-toggle { background: var(--clr-surface-light); color: var(--clr-info); border: 1.5px solid var(--clr-border-strong); border-radius: 4px; padding: 2px 7px; font-size: var(--fs-sm); margin-right: 6px; font-family: inherit; cursor: pointer; }
    .tree-indent { display:inline-block; }

    /* ── Table Filter Menu ── */
    .table-filter-menu { position: fixed; z-index: 3000; width: 280px; max-height: 420px; overflow: auto; background:var(--clr-surface); border:1.5px solid var(--clr-border-strong); border-radius:var(--radius-md); box-shadow:var(--shadow-lg); padding:12px; }
    .table-filter-menu h4 { margin:0 0 8px; font-size:var(--fs-body); color:var(--clr-info); font-weight:700; }
    .table-filter-actions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .table-filter-actions button { padding:6px 10px; font-size:var(--fs-sm); }
    .table-filter-options { border-top:1px solid var(--clr-border); padding-top:8px; }
    .table-filter-options label { display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); margin:4px 0; }
    th.filter-active { background: var(--clr-sidebar-active); position:relative; }
    th.filter-active::after { content:' ⏷'; color:var(--clr-info); font-size:var(--fs-sm); }

    /* ── Column Resizer ── */
    .col-resizer { position:absolute; top:0; right:-2px; width:8px; height:100%; cursor:col-resize; user-select:none; }
    .col-resizer:hover, th.resizing .col-resizer { background:var(--clr-focus-ring); }

    /* ── Email Editor ── */
    .email-editor-toolbar { gap:6px; margin-top:8px; }
    .email-editor-toolbar button { padding:6px 10px; font-size:var(--fs-sm); }
    .email-editor { min-height:260px; border:1.5px solid var(--clr-border-strong); border-radius:var(--radius-sm); padding:12px; background:#fff; overflow:auto; }
    .email-editor:focus { outline:2px solid var(--clr-accent-1); outline-offset:0; }
    .email-editor-source { width:100%; min-height:260px; border:1.5px solid var(--clr-border-strong); border-radius:var(--radius-sm); padding:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:var(--fs-sm); }
    .email-template-preview { width:100%; border:1px solid var(--clr-border); border-radius:var(--radius-sm); background:#fff; min-height:140px; padding:12px; }

    /* ── Email Designer Tabs ── */
    .email-designer-tabs { display:flex; gap:8px; margin:12px 0; }
    .email-designer-tab { border:1.5px solid var(--clr-border-strong); border-radius:99px; padding:7px 16px; background:var(--clr-surface); color:var(--clr-info); font-weight:600; font-size:var(--fs-body); cursor:pointer; transition: all .15s; font-family: inherit; }
    .email-designer-tab:hover { background: var(--clr-surface-light); }
    .email-designer-tab.active { background:var(--clr-info); color:#fff; border-color:transparent; }
    .email-designer-panel { display:none; }
    .email-designer-panel.active { display:block; }
    .email-designer-layout { display:grid; grid-template-columns: minmax(560px,1fr) minmax(420px,1fr); gap:16px; align-items:start; }
    .empty-table-hidden { display:none; }

    /* ── Sidebar ── */
    .side-nav { width:220px; min-width:180px; background: var(--clr-surface); border:1px solid var(--clr-border); border-radius:var(--radius-lg); padding:16px 0 10px; flex-shrink:0; align-self:flex-start; position:sticky; top:8px; box-shadow: var(--shadow-md); }
    .side-nav-section-label { padding:2px 16px 10px; font-size:10px; font-weight:700; color:var(--clr-muted); letter-spacing:.08em; text-transform:uppercase; }
    .side-nav-item { display:flex; align-items:center; width:100%; padding:10px 16px; background:none; border:none; border-left:3px solid transparent; text-align:left; font-size:var(--fs-body); color:var(--clr-muted); cursor:pointer; line-height:1.4; box-sizing:border-box; transition:all .15s; font-family:inherit; font-weight:600; }
    .side-nav-item:hover { background: var(--clr-sidebar-hover); color:var(--clr-text); border-left-color:var(--clr-border-strong); }
    .side-nav-item.active { background: var(--clr-sidebar-active); color:var(--clr-info); font-weight:700; border-left-color:var(--clr-accent-1); }

    /* ── User Table ── */
    .user-row-selected td { background:var(--clr-surface-light) !important; }
    .user-row { cursor:pointer; }
    .user-row:hover td { background:var(--clr-surface-tint); }
    .validation-empty-cell { background:var(--clr-error-bg); }
    .count-hover { text-decoration: underline dotted; cursor: help; }

    /* ── KPI Cards ── */
    .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin:14px 0; }
    .kpi-card { border:1px solid var(--clr-border); border-top:4px solid var(--clr-accent-1); background:var(--clr-surface); border-radius:var(--radius-md); padding:18px; color:var(--clr-text); box-shadow: var(--shadow-sm); }
    .kpi-card:nth-child(4n+1) { border-top-color: var(--clr-accent-1); }
    .kpi-card:nth-child(4n+2) { border-top-color: var(--clr-accent-2); }
    .kpi-card:nth-child(4n+3) { border-top-color: var(--clr-accent-4); }
    .kpi-card:nth-child(4n+4) { border-top-color: var(--clr-accent-3); }
    .kpi-card b { color:var(--clr-text); }
    .kpi-card .kpi-label { font-size:var(--fs-sm); font-weight:600; letter-spacing:.08em; line-height:1.3; text-transform:uppercase; color:var(--clr-muted); }
    .kpi-card .kpi-value { font-size:22px; font-weight:700; margin-top:4px; }
    .sync-status-card { border:1px solid var(--clr-border); border-radius:var(--radius-md); background:#fff; padding:18px; box-shadow:var(--shadow-sm); }
    .sync-status-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .sync-state-badge { display:inline-flex; align-items:center; padding:6px 12px; border-radius:999px; font-weight:700; font-size:var(--fs-sm); border:1px solid var(--clr-border-neutral); }
    .sync-state-badge.ok { background:var(--clr-success-bg); color:var(--clr-success); border-color:var(--clr-success-border); }
    .sync-state-badge.running { background:var(--clr-info-bg); color:var(--clr-info); border-color:var(--clr-info-border); }
    .sync-state-badge.warning { background:var(--clr-warn-bg); color:var(--clr-warn); border-color:var(--clr-warn-border); }
    .sync-state-badge.error { background:var(--clr-error-bg); color:var(--clr-error); border-color:var(--clr-error-border); }
    .sync-progress-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:12px 0; }
    .sync-progress-item { border:1px solid var(--clr-border); border-radius:var(--radius-sm); padding:12px; background:var(--clr-surface-tint); }
    .sync-progress-item strong { display:block; margin-bottom:4px; }
    .sync-bar { height:8px; border-radius:99px; background:#e8ecef; overflow:hidden; margin-top:8px; }
    .sync-bar span { display:block; height:100%; background:linear-gradient(90deg,var(--clr-accent-1),#8db8d3); }
    .sync-bar.large { height:18px; }
    .sync-bar.indeterminate span { width:30% !important; animation:syncSlide 1.4s ease-in-out infinite alternate; }
    @keyframes syncSlide { from { margin-left:0; } to { margin-left:70%; } }
    .sync-progress-item.pending .sync-bar span { background:#d5dde3; }
    .sync-progress-item.done .sync-bar span { background:var(--clr-accent-2); }
    .sync-progress-item.warning .sync-bar span { background:var(--clr-accent-3-end); }
    .sync-progress-item.skipped { opacity:0.6; }
    .sync-progress-eta { margin:8px 0 4px 0; font-weight:600; }

    /* ── Validation Table – kompaktes Layout ── */
    .validation-table-wrap { overflow-x: auto; }
    #validationMasterdataTable { table-layout: fixed; font-size: var(--fs-sm); }
    #validationMasterdataTable th,
    #validationMasterdataTable td { padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #validationMasterdataTable td:last-child { white-space: normal; overflow: visible; text-overflow: unset; }
    #validationMasterdataTable th:last-child { overflow: visible; }

    /* ── Mail Log ── */
    .mail-log-badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:var(--fs-sm); font-weight:700; }
    .mail-log-badge.sent { background:var(--clr-success-bg); color:var(--clr-success); border:1px solid var(--clr-success-border); }
    .mail-log-badge.none { background:#f1f3f5; color:var(--clr-muted); border:1px solid var(--clr-border-neutral); }
    .risk-badge { display:inline-block; min-width:76px; text-align:center; padding:4px 10px; border-radius:999px; font-size:var(--fs-sm); font-weight:700; border:1px solid transparent; }
    .risk-ok { background:var(--clr-success-bg); color:var(--clr-success); border-color:var(--clr-success-border); }
    .risk-hint { background:var(--clr-warn-bg); color:var(--clr-warn); border-color:var(--clr-warn-border); }
    .risk-review { background:var(--clr-error-bg); color:var(--clr-error); border-color:var(--clr-error-border); }
    .party-detail-box { margin-top:14px; border:1px solid var(--clr-border); border-radius:var(--radius-md); background:var(--clr-surface-tint); padding:14px; }
    .party-detail-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin:10px 0; }
    .party-detail-card { border:1px solid var(--clr-border); border-radius:var(--radius-sm); background:#fff; padding:12px; }
    .mail-log-modal { position:fixed; inset:0; background:rgba(38,40,42,.5); backdrop-filter:blur(6px); z-index:3500; display:flex; align-items:center; justify-content:center; }
    .mail-log-modal-card { width:min(920px,95vw); max-height:85vh; overflow:auto; background:var(--clr-surface); border-radius:var(--radius-lg); border:1.5px solid var(--clr-border-strong); box-shadow:var(--shadow-lg); padding:20px; }

    /* ── Color Picker WCAG Target Size ── */
    input[type="color"] { width: 44px; height: 44px; padding: 2px; cursor: pointer; border-radius: var(--radius-sm); border: 1.5px solid var(--clr-border-strong); }

    /* ── Hamburger Button ── */
    .hamburger-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--clr-surface-light);
      border: 1.5px solid var(--clr-border-strong);
      border-radius: var(--radius-sm);
      color: var(--clr-info);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      font-family: inherit;
    }
    .hamburger-btn:hover {
      background: var(--clr-sidebar-active);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* ── Sidebar Overlay (backdrop when drawer is open) ── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(38,40,42,.45);
      backdrop-filter: blur(4px);
      z-index: 899;
    }
    .sidebar-overlay.active {
      display: block;
    }

    /* ── Sidebar Drawer Open State ── */
    .side-nav.side-nav-open {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 260px;
      min-width: 0;
      z-index: 900;
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      overflow-y: auto;
      animation: slideInLeft .22s ease-out;
    }

    @keyframes slideInLeft {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }

    /* ── Responsive: Mobile (<768px) ── */
    @media (max-width: 767px) {

      /* Body: reduce outer padding */
      body { padding: 10px; }

      /* Header: allow wrapping, reduce padding */
      .app-header { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
      .app-header h1 { font-size: var(--fs-sub); }
      .app-header .app-subtitle { font-size: var(--fs-sm); }

      /* Version badge: reposition below header instead of overlapping */
      .app-version { position: static; display: block; text-align: center; margin: 8px 0; border-radius: var(--radius-sm); }

      /* Main layout: stack vertically instead of side-by-side.
         IMPORTANT: #mainLayout has inline style "display:flex", so we
         must use !important to override it from CSS. */
      #mainLayout { flex-direction: column !important; }

      /* Sidebar: hide on mobile (hamburger toggle comes in Plan 02) */
      .side-nav { display: none; }

      /* Main content: remove left padding that was spacing from sidebar */
      #mainContent { padding-left: 0 !important; }

      /* Inputs: override the global min-width:420px that causes overflow */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      select { min-width: 0; width: 100%; box-sizing: border-box; }

      /* Tabs: stack vertically */
      .tabs { flex-direction: column; }
      .area-tabs { flex-direction: column; }

      /* Toolbar: stack vertically, full-width children */
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar input,
      .toolbar select,
      .toolbar button,
      .toolbar label { width: 100%; box-sizing: border-box; text-align: left; }

      /* Settings grid: single column */
      .settings-grid { grid-template-columns: 1fr; }

      /* KPI grid: single column */
      .kpi-grid { grid-template-columns: 1fr; }

      /* Tables: horizontal scroll wrapper */
      table { display: block; overflow-x: auto; }

      /* Section tabs and validation subtabs: wrap */
      .section-tabs { flex-wrap: wrap; justify-content: flex-start; }
      .validation-subtabs { flex-wrap: wrap; }

      /* Panels: reduce padding */
      .panel { padding: 12px; }

      /* Version popup: full-width */
      .version-popup { left: 10px; right: 10px; width: auto; top: auto; }

      /* Login card: reduce padding */
      .login-card { padding: 18px; }

      /* Settings overlay: reduce padding */
      #settingsOverlay { padding: 10px !important; }

      /* Hamburger: show on mobile */
      .hamburger-btn { display: flex; }
    }

  </style>
</head>

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`);
      const json = await response.json();
      if (!response.ok) throw new Error(json.error || 'API-Fehler');
      return json;
    }

    async function apiPost(path, payload) {
      const response = await fetch(`${API_BASE}${path}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      const json = await response.json();
      if (!response.ok) {
        const error = new Error(json.error || 'API-Fehler');
        error.code = json.code || '';
        error.details = json;
        throw error;
      }
      return json;
    }

    async function fetchExecutables() { return apiGet('/api/executables'); }

    function formatVersion(raw) {
      const m = /^(\d{4})(\d{2})(\d{2})\d{6}-(\d+)$/.exec(raw);
      if (!m) return raw;
      const [, y, mo, d, seq] = m;
      return `Build ${parseInt(seq, 10)} · ${d}.${mo}.${y}`;
    }

    async function loadVersion() {
      const box = document.getElementById('appVersion');
      if (!box) return;
      try {
        const data = await apiGet('/api/version');
        box.textContent = formatVersion(data.version || '') || 'dev';
      } catch (_) {
        box.textContent = 'dev';
      }
    }


    async function loadVersionHistory() {
      const popup = document.getElementById('versionHistoryPopup');
      const list = document.getElementById('versionHistoryList');
      if (!popup || !list) return;
      try {
        const data = await apiGet('/api/version/history');
        const versions = Array.isArray(data.versions) ? data.versions : [];
        list.innerHTML = versions.map(v =>
          `<li><strong>${v.version || 'n/a'}</strong> <em>(${v.timestamp || ''})</em><br>${v.summary || ''}</li>`
        ).join('');
      } catch (e) {
        list.innerHTML = '<li>Versionshistorie konnte nicht geladen werden.</li>';
      }
    }

      document.getElementById('mainLayout').style.display = 'none';

      document.getElementById('mainLayout').style.display = 'flex';
    }

    function wireVersionPopup() {
      const badge = document.getElementById('appVersion');
      const popup = document.getElementById('versionHistoryPopup');
      if (!badge || !popup) return;

      badge.addEventListener('click', async (e) => {
        e.stopPropagation();
        const show = popup.style.display === 'none';
        popup.style.display = show ? 'block' : 'none';
        if (show) {
          await loadVersionHistory();
        }
      });

      document.addEventListener('click', (e) => {
        if (!popup.contains(e.target) && e.target !== badge) {
          popup.style.display = 'none';
        }
      });

    async function fetchPartyAnalyticsData() {
      const status = document.getElementById('analyticsPartyStatus');
      const fromDateInput = document.getElementById('analyticsFromDate');
      const toDateInput = document.getElementById('analyticsToDate');
      if (!status) return;
      try {
        const fromDate = fromDateInput ? fromDateInput.value : '';
        const toDate = toDateInput ? toDateInput.value : '';
        if (fromDate && toDate) {
          const diffDays = Math.round((new Date(toDate) - new Date(fromDate)) / 86400000);
          if (diffDays > 180) {
            const proceed = window.confirm(`Du lädst einen Zeitraum von ${diffDays} Tagen. Das kann je nach API sehr lange dauern. Fortfahren?`);
            if (!proceed) { status.textContent = 'Backtreff-Auswertung abgebrochen.'; return; }
          }
        }
        status.textContent = 'Lade Backtreff-Auswertung...';
        const data = await apiPost('/api/analytics/parties', { fromDate, toDate });
        renderPartyAnalytics(data);
      } catch (error) {
        status.textContent = `Fehler bei Backtreff-Auswertung: ${error.message}`;
      }
    }

    }

    function formatBytes(bytes) {
      const value = Number(bytes || 0);
      if (!Number.isFinite(value) || value <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let n = value;
      let idx = 0;
      while (n >= 1024 && idx < units.length - 1) {
        n /= 1024;
        idx++;
      }
      return `${n.toLocaleString('de-DE', { maximumFractionDigits: idx === 0 ? 0 : 1 })} ${units[idx]}`;
    }

    function formatSyncTimestamp(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
    }

    function syncStateClass(state, running) {
      const text = String(state || '').toLowerCase();
      if (running || text.includes('läuft')) return 'running';
      if (text.includes('aktuell')) return 'ok';
      if (text.includes('fehler')) return 'error';
      return 'warning';
    }

    /** Zeigt den Fehler des letzten Laufs prominent an – bisher stand er nur klein in der Läufe-Tabelle. */
    function renderSyncErrorBanner(lastRun, lastRunFailed, running) {
      const banner = document.getElementById('syncErrorBanner');
      if (!banner) return;
      if (!lastRunFailed || running) {
        banner.style.display = 'none';
        banner.innerHTML = '';
        return;
      }
      const mode = String(lastRun.mode || '').trim();
      const modeLabel = mode === 'delta' ? 'Delta-Sync' : (mode === 'deep' ? 'Deep-Check' : 'Initialsync');
      banner.style.display = '';
      banner.innerHTML = `<div><strong>Letzter Sync fehlgeschlagen</strong> — ${escapeHtml(modeLabel)}`
        + `${lastRun.id ? ` (Lauf #${escapeHtml(String(lastRun.id))})` : ''}`
        + `, ${escapeHtml(formatSyncTimestamp(lastRun.finishedAt || lastRun.startedAt))}</div>`
        + `<div style="margin-top:4px;font-weight:500;">${escapeHtml(String(lastRun.error || 'Kein Fehlertext hinterlegt.'))}</div>`
        + `<div class="toolbar" style="margin-top:10px;"><button id="syncRetryBtn" type="button" class="secondary">Erneut versuchen</button></div>`;
      document.getElementById('syncRetryBtn')?.addEventListener('click', () => startGoAffProSync(mode || 'delta'));
    }

    function formatDuration(seconds) {
      const s = Number(seconds);
      if (!Number.isFinite(s) || s < 0) return '-';
      if (s < 60) return `${Math.max(1, Math.round(s))} s`;
      const totalMinutes = Math.round(s / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours > 0 ? `${hours} h ${minutes} min` : `${minutes} min`;
    }

    function syncPhaseLabel(phase) {
      switch (String(phase || '')) {
        case 'preflight': return 'Ermittle Datenmengen (Pre-Flight)…';
        case 'downloads': return 'Lade verknüpfte Dateien und Assets…';
        default: return '';
      }
    }

    function syncModeLabel(mode) {
      if (mode === 'delta') return 'Delta-Sync';
      if (mode === 'deep') return 'Deep-Check';
      return 'Initialsync';
    }

    function renderSyncProgress(data) {
      const card = document.getElementById('syncProgressCard');
      if (!card) return;
      const run = data.currentRun;
      if (!data.running || !run) {
        card.style.display = 'none';
        card.innerHTML = '';
        return;
      }
      card.style.display = '';
      const budget = data.budget || {};
      const planned = Array.isArray(run.plannedEndpoints) ? run.plannedEndpoints : [];
      const percent = Number(run.progressPercent);
      const determinate = Number.isFinite(percent) && percent >= 0;
      const phaseLabel = syncPhaseLabel(run.phase);

      const parts = [];
      if (phaseLabel) parts.push(phaseLabel);
      if (run.phase === 'endpoints' && Number(run.endpointCount) > 0 && Number(run.endpointIndex) > 0) {
        parts.push(`Endpoint ${run.endpointIndex}/${run.endpointCount}: ${run.currentEndpoint || '-'}${Number(run.currentPage) > 0 ? `, Seite ${run.currentPage}` : ''}`);
      }
      if (Number(run.downloadsSkipped) > 0) {
        parts.push(`${Number(run.downloadsSkipped).toLocaleString('de-DE')} Dateien bereits vorhanden, übersprungen`);
      }
      let etaText = '';
      if (determinate) {
        parts.push(`${percent} %`);
        if (Number(run.estimatedRemainingCalls) >= 0 && Number(run.etaSeconds) >= 0) {
          const maxSuffix = Number(run.etaMaxSeconds) > Number(run.etaSeconds)
            ? ` (bis ~${formatDuration(run.etaMaxSeconds)} mit 504-Retry)` : '';
          etaText = `Ca. ${Number(run.estimatedRemainingCalls).toLocaleString('de-DE')} API-Calls verbleibend – fertig in ~${formatDuration(run.etaSeconds)}${maxSuffix}, voraussichtlich ${formatSyncTimestamp(run.etaAt)}`;
          if (run.mode !== 'delta') etaText += ' (zzgl. Datei-Downloads)';
        }
      } else if (run.mode === 'delta') {
        parts.push('Restmenge unbekannt (Delta-Läufe melden keine Gesamtzahl)');
      } else {
        parts.push('Restmenge noch unbekannt');
      }

      const callsUsed = Number(budget.callsUsedLastHour || 0);
      const callLimit = Math.max(1, Number(budget.callLimitPerHour || 60));
      const budgetPct = Math.min(100, Math.round((callsUsed / callLimit) * 100));
      const waitingBadge = budget.waitingForBudget
        ? ` <span class="sync-state-badge warning">Wartet auf API-Budget – nächster Call in ~${escapeHtml(String(budget.nextCallInSeconds || 0))} s</span>`
        : '';

      const sourceLabels = { api: 'API-Total', probe: 'API-Probe', history: 'letzter Lauf', inventory: 'lokaler Bestand' };
      const endpointItems = planned.map(p => {
        const expected = (p.expectedTotal === null || p.expectedTotal === undefined) ? null : Number(p.expectedTotal);
        const seen = Number(p.seen || 0);
        const state = String(p.state || 'pending');
        let barClass = 'sync-bar';
        let width = 4;
        if (state === 'done' || state === 'warning') {
          width = 100;
        } else if (expected !== null && expected > 0) {
          width = Math.min(100, Math.max(4, Math.round((seen / expected) * 100)));
        } else if (state === 'active') {
          barClass += ' indeterminate';
        }
        const sourceLabel = sourceLabels[String(p.estimateSource || '')] || '';
        const countText = state === 'skipped'
          ? 'Übersprungen'
          : expected !== null
            ? `${seen.toLocaleString('de-DE')} / ${expected.toLocaleString('de-DE')}`
            : `${seen.toLocaleString('de-DE')} / ?`;
        const sourceHint = state !== 'skipped' && sourceLabel ? `<span class="settings-hint"> · Schätzung: ${escapeHtml(sourceLabel)}</span>` : '';
        return `<div class="sync-progress-item ${escapeHtml(state)}"><strong>${escapeHtml(p.displayName || p.endpointKey || '')}</strong><div>${escapeHtml(countText)}${sourceHint}</div><div class="${barClass}"><span style="width:${width}%"></span></div></div>`;
      }).join('');

      card.innerHTML = `
        <div class="sync-status-head">
          <div>
            <strong>Sync-Fortschritt</strong>
            <div class="settings-hint">${escapeHtml(parts.join(' – '))}</div>
          </div>
          <span class="sync-state-badge running">${escapeHtml(syncModeLabel(run.mode))} läuft</span>
        </div>
        <div class="sync-bar large${determinate ? '' : ' indeterminate'}"><span style="width:${determinate ? Math.max(2, percent) : 30}%"></span></div>
        ${etaText ? `<div class="sync-progress-eta">${escapeHtml(etaText)}</div>` : ''}
        <div class="settings-hint">API-Budget: ${escapeHtml(String(callsUsed))} / ${escapeHtml(String(callLimit))} Calls in der letzten Stunde${waitingBadge}</div>
        <div class="sync-bar"><span style="width:${budgetPct}%"></span></div>
        ${endpointItems ? `<div class="sync-progress-grid">${endpointItems}</div>` : ''}
      `;
    }

    async function pollSyncProgress() {
      try {
        const data = await apiGet('/api/sync/status');
        renderSyncProgress(data);
        if (!data.running) {
          stopSyncFastPoll();
          await loadSyncStatus();
        }
      } catch (error) {
        // stiller Fehlschlag – der nächste Tick oder der 30-s-Poll versucht es erneut
      }
    }

    function startSyncFastPoll() {
      if (!syncFastPollTimer) {
        syncFastPollTimer = window.setInterval(pollSyncProgress, 10000);
      }
    }

    function stopSyncFastPoll() {
      if (syncFastPollTimer) {
        window.clearInterval(syncFastPollTimer);
        syncFastPollTimer = null;
      }

    // ── Datensicherung & Umzug ──────────────────────────────────────────────────
    let backupPollTimer = null;
    let backupUploadToken = null;

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (!Number.isFinite(n) || n <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let v = n, i = 0;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return `${v.toLocaleString('de-DE', { maximumFractionDigits: i === 0 ? 0 : 1 })} ${units[i]}`;
    }

    async function loadBackupStatus() {
      try {
        const data = await apiGet('/api/backup/status');
        renderBackupJob(data);
        renderBackupArchives(data.archives || []);
        if (data.running) startBackupPoll(); else stopBackupPoll();
      } catch (error) {
        // stiller Fehlschlag - der nächste Aufruf versucht es erneut
      }
    }

    function renderBackupJob(data) {
      const card = document.getElementById('backupJobCard');
      const status = document.getElementById('backupStatusText');
      const job = data.job;
      if (!card) return;
      if (!job) { card.style.display = 'none'; card.innerHTML = ''; return; }

      const laeuft = job.running === true;
      const titel = job.job === 'import' ? 'Import' : 'Sicherung';
      if (status) {
        if (laeuft) status.textContent = `${titel} läuft: ${job.phaseLabel || 'wird vorbereitet'} …`;
        else if (job.status === 'error') status.textContent = `${titel} fehlgeschlagen: ${job.message || ''}`;
        else status.textContent = job.message || `${titel} abgeschlossen.`;
      }

      const done = Number(job.doneBytes || 0), total = Number(job.totalBytes || 0);
      const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : -1;
      const bar = laeuft
        ? `<div class="sync-bar large${pct < 0 ? ' indeterminate' : ''}"><span style="width:${pct < 0 ? 30 : Math.max(2, pct)}%"></span></div>`
        : '';
      const badgeClass = laeuft ? 'running' : (job.status === 'error' ? 'error' : 'ok');
      const badgeText = laeuft ? `${titel} läuft` : (job.status === 'error' ? 'Fehler' : 'Fertig');

      let bericht = '';
      if (!laeuft && job.job === 'import' && job.status === 'success') {
        const zeilen = [
          `Dateien neu zugeordnet: ${job.filePathsRebased ?? 0}` +
            (Number(job.filePathsMissing || 0) > 0 ? `, fehlend: ${job.filePathsMissing}` : '') +
            (Number(job.filePathsForeign || 0) > 0 ? `, nicht zuordenbar: ${job.filePathsForeign}` : ''),
          `Versandprotokoll angepasst: ${job.mailLogRebased ?? 0} Pfade` +
            (Number(job.mailLogDropped || 0) > 0 ? `, ${job.mailLogDropped} ohne Entsprechung` : ''),
          job.countersTaken ? 'Belegnummern-Zähler übernommen.' : 'Belegnummern-Zähler dieser Umgebung beibehalten.',
          ...(Array.isArray(job.notes) ? job.notes : [])
        ];
        bericht = `<div class="settings-hint" style="margin-top:8px;">${zeilen.map(z => escapeHtml(String(z))).join('<br>')}</div>`;
      }

      card.style.display = '';
      card.innerHTML = `<div class="sync-status-head">
          <div><strong>${escapeHtml(titel)}</strong>
            <div class="settings-hint">${escapeHtml(job.phaseLabel || job.message || '')}</div></div>
          <span class="sync-state-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
        </div>${bar}${bericht}`;
    }

    function renderBackupArchives(list) {
      const box = document.getElementById('backupArchiveList');
      if (!box) return;
      if (!list.length) { box.innerHTML = '<span class="settings-hint">Noch keine Archive vorhanden.</span>'; return; }
      box.innerHTML = list.map(a => {
        const href = `${API_BASE}/api/backup/download?file=${encodeURIComponent(a.name)}`;
        return `<span class="pill"><a href="${href}">${escapeHtml(a.name)}</a> · ${escapeHtml(formatBytes(a.bytes))}</span>`;
      }).join('');
    }

    function startBackupPoll() {
      if (!backupPollTimer) backupPollTimer = window.setInterval(loadBackupStatus, 2000);
    }
    function stopBackupPoll() {
      if (backupPollTimer) { window.clearInterval(backupPollTimer); backupPollTimer = null; }
    }

    async function startBackupExport() {
      const status = document.getElementById('backupStatusText');
      try {
        const includeSecrets = !!document.getElementById('backupIncludeSecrets')?.checked;
        if (includeSecrets && !window.confirm('Das Archiv enthält dann Zugangsdaten im Klartext. Fortfahren?')) return;
        if (status) status.textContent = 'Sicherung wird gestartet …';
        await apiPost('/api/backup/export', { includeSecrets });

        await loadBackupStatus();
      } catch (error) {
        if (status) status.textContent = `Sicherung nicht gestartet: ${error.message}`;

    async function checkBackupArchive() {
      const status = document.getElementById('backupStatusText');
      const preview = document.getElementById('backupImportPreview');
      const row = document.getElementById('backupImportConfirmRow');
      const file = document.getElementById('backupImportFile')?.files?.[0];
      backupUploadToken = null;
      if (row) row.style.display = 'none';
      if (!file) { if (preview) preview.textContent = 'Bitte zuerst eine Archivdatei auswählen.'; return; }
      try {
        if (status) status.textContent = `Archiv wird geprüft (${formatBytes(file.size)}) …`;
        const response = await fetch(`${API_BASE}/api/backup/import/upload`, { method: 'POST', body: file });
        const json = await response.json();
        if (!response.ok) throw new Error(json.error || 'Archiv konnte nicht gelesen werden.');
        backupUploadToken = json.token;
        const m = json.manifest || {};
        const zaehler = m.counters || {};
        const zeilen = [
          `Erstellt: ${escapeHtml(String(m.createdAt || '-'))}`,
          `Quelle: ${escapeHtml(String((m.source || {}).osName || '-'))} — ${escapeHtml(String((m.source || {}).pdfExportPath || '-'))}`,
          `Größe: ${escapeHtml(formatBytes(json.bytes))}`,
          `Zugangsdaten: ${(m.contents || {}).secrets === 'included' ? 'enthalten' : 'nicht enthalten'}`,
          `Belegnummern-Zähler: ${zaehler.gutschriftCounter ? `GS ${escapeHtml(String(zaehler.gutschriftCounter))}` : 'keine'}` +
            `${zaehler.rechnungCounter ? `, RE ${escapeHtml(String(zaehler.rechnungCounter))}` : ''}`,
          `Datensätze: ${escapeHtml(String((m.database || {}).entityCount ?? '-'))}`
        ];
        if (preview) preview.innerHTML = zeilen.join('<br>');
        if (row) row.style.display = '';
        if (status) status.textContent = 'Archiv geprüft. Bitte Import bestätigen.';
      } catch (error) {
        if (preview) preview.textContent = '';
        if (status) status.textContent = `Archiv abgelehnt: ${error.message}`;
      }
    }

    async function applyBackupImport() {
      const status = document.getElementById('backupStatusText');

        if (status) status.textContent = 'Import wird gestartet …';

        });

    function recommendationClass(value) {
      const text = String(value || '').toLowerCase();
      if (text.includes('ok')) return 'risk-ok';
      if (text.includes('ignorieren') || text.includes('deprecated')) return 'risk-hint';
      if (text.includes('pagination') || text.includes('fields')) return 'risk-hint';
      return 'risk-alert';
    }

    function renderSyncDiagnostics(data) {
      const estimate = document.getElementById('syncDiagnosticsEstimate');
      const status = document.getElementById('syncDiagnosticsStatus');
      const summaryBody = document.getElementById('syncDiagnosticsSummaryBody');
      const resultBody = document.getElementById('syncDiagnosticsResultBody');
      const runBtn = document.getElementById('syncDiagnosticsRunBtn');
      if (!estimate || !status || !summaryBody || !resultBody) return;
      const selectedCount = selectedSyncDiagnosticEndpoints().length || 0;
      const perEndpointCalls = data && data.defaultEndpoints && data.estimatedDefaultApiCalls
        ? Math.max(1, Math.round(Number(data.estimatedDefaultApiCalls || 0) / Math.max(1, data.defaultEndpoints.length)))
        : 8;
      const baseCalls = selectedCount * perEndpointCalls;
      const maxCalls = data && data.estimatedDefaultMaxApiCalls && data.defaultEndpoints
        ? Math.round(Number(data.estimatedDefaultMaxApiCalls || 0) / Math.max(1, data.defaultEndpoints.length)) * selectedCount
        : baseCalls + selectedCount;
      const callLimit = Math.max(1, Number(data.callLimitPerHour || 60));
      const sliding = data.slidingWindowEnabled !== false;
      const burst = Number.isFinite(Number(data.budgetCallsRemainingNow)) ? Number(data.budgetCallsRemainingNow) : callLimit;
      const spacingSec = Math.max(0.3, Number(data.minCallSpacingMs || 0) / 1000);
      const windowSec = 3600 / callLimit;
      const estimatedSeconds = sliding
        ? (maxCalls <= burst ? maxCalls * spacingSec : burst * spacingSec + (maxCalls - burst) * windowSec)
        : maxCalls * windowSec;
      const durationText = estimatedSeconds < 90 ? `${Math.max(1, Math.ceil(estimatedSeconds))} Sek.` : `${Math.ceil(estimatedSeconds / 60)} Min.`;
      estimate.textContent = `Geschätzte API-Calls: ${baseCalls} Basis, bis ${maxCalls} mit 504-Retry; bei ${callLimit}/Stunde aktuell ca. ${durationText}`;
      const currentRun = data.currentRun || {};
      const latestRun = data.latestRun || {};
      const running = data.running === true || currentRun.status === 'running';
      if (runBtn) runBtn.disabled = running || selectedCount === 0;
      if (running) {
        status.textContent = `Diagnose läuft: ${currentRun.currentEndpoint || '-'}; API-Calls ${currentRun.apiCalls || 0}; Warnungen ${currentRun.warningCount || 0}`;
      } else if (latestRun.id) {
        status.textContent = `Letzte Diagnose #${latestRun.id}: ${latestRun.status || '-'}, ${latestRun.apiCalls || 0} API-Calls, ${formatSyncTimestamp(latestRun.finishedAt || latestRun.startedAt)}.`;
      } else {
        status.textContent = 'Noch kein Diagnoselauf vorhanden.';
      }
      const summaries = Array.isArray(data.endpointSummaries) ? data.endpointSummaries : [];
      summaryBody.innerHTML = summaries.map(row => `
        <tr>
          <td>${escapeHtml(row.displayName || row.endpointKey || '')}<div class="settings-hint">${escapeHtml(row.endpointKey || '')}</div></td>
          <td><span class="risk-badge ${recommendationClass(row.recommendation)}">${escapeHtml(row.recommendation || '-')}</span></td>
          <td>${escapeHtml(String(row.okResponses || 0))}</td>
          <td>${escapeHtml(String(row.maxItems || 0))}</td>
          <td>${escapeHtml(String(row.emptyItems || 0))}</td>
          <td>${escapeHtml((Array.isArray(row.warnings) ? row.warnings : []).join(' | '))}</td>
        </tr>
      `).join('');
      const results = Array.isArray(data.results) ? data.results : [];
      resultBody.innerHTML = results.map(row => `
        <tr>
          <td>${escapeHtml(row.displayName || row.endpointKey || '')}</td>
          <td>${escapeHtml(row.variant || '')}<div class="settings-hint">${escapeHtml(row.apiPath || '')}</div></td>
          <td>${escapeHtml(String(row.httpCode || 0))}</td>
          <td>${escapeHtml(String(row.durationMs || 0))}</td>
          <td>${formatBytes(row.responseBytes || 0)}</td>
          <td>${escapeHtml(row.arrayField || '')}</td>
          <td>${escapeHtml(String(row.itemCount || 0))}</td>
          <td>${escapeHtml(String(row.emptyItemCount || 0))}</td>
          <td>${row.repeated ? 'Ja' : 'Nein'}</td>
          <td>${row.fieldsEffective ? 'OK' : 'Problem'}</td>
          <td>${escapeHtml((Array.isArray(row.stableIds) ? row.stableIds : []).join(', '))}</td>
          <td>${escapeHtml(row.warning || row.error || '')}</td>
        </tr>
      `).join('');
      updateEmptyTablesVisibility(document);
    }

    async function loadSyncDiagnostics() {
      try {

        if (data.running) {

            syncDiagnosticsPollTimer = window.setInterval(loadSyncDiagnostics, 30000);
          }
        } else if (syncDiagnosticsPollTimer) {
          window.clearInterval(syncDiagnosticsPollTimer);
          syncDiagnosticsPollTimer = null;
        }
      } catch (error) {
        const status = document.getElementById('syncDiagnosticsStatus');

      const status = document.getElementById('syncDiagnosticsStatus');
      const endpoints = selectedSyncDiagnosticEndpoints();
      try {
        if (status) status.textContent = 'Starte Diagnose...';
        const data = await apiPost('/api/sync/diagnostics/run', { endpoints });

    async function loadSyncStatus() {
      const status = document.getElementById('syncStatusText');
      if (status) status.textContent = 'Lade GoAffPro-Syncstatus...';
      try {
        const [statusData, inventoryData, runsData] = await Promise.all([
          apiGet('/api/sync/status'),
          apiGet('/api/sync/inventory'),
          apiGet('/api/sync/runs?limit=20')
        ]);
        statusData.endpointRows = Array.isArray(inventoryData.endpointRows) ? inventoryData.endpointRows : [];
        statusData.recentRuns = Array.isArray(runsData.rows) ? runsData.rows : (statusData.recentRuns || []);
        renderSyncStatus(statusData);
        if (statusData.running) {
          startSyncFastPoll();
        } else {
          stopSyncFastPoll();
        }
      } catch (error) {
        if (status) status.textContent = `Fehler beim Syncstatus: ${error.message}`;
      }

    async function startGoAffProSync(mode) {
      const status = document.getElementById('syncStatusText');
      try {
        if (status) status.textContent = `Starte ${mode}-Sync...`;
        const data = await apiPost('/api/sync/run', { mode });
        renderSyncStatus(data);
        // Server-Meldung sichtbar machen: bei pausiertem Sync antwortet der Server mit HTTP 200
        // und einem Hinweis - ohne Anzeige sieht es so aus, als passiere gar nichts.
        const gestartet = data.running === true;
        if (status && data.message) status.textContent = data.message;
        if (gestartet) {
          startSyncFastPoll();
          window.setTimeout(loadSyncStatus, 2000);
        }
      } catch (error) {
        if (status) status.textContent = `Sync konnte nicht gestartet werden: ${error.message}`;
      }
    }

    function renderValidationTable() {

          ? '<span class="mail-log-badge none">nicht versendet</span>'
          : `<span class="mail-log-badge sent">${logs.length} gesendet</span> <button type="button" class="secondary reminder-log-btn" data-advisor-id="${escapeHtml(String(r.id || ''))}">anzeigen</button><div class="settings-hint">letzte: ${escapeHtml(last.toEmail || '')} (${escapeHtml(last.sentAt || '')})</div>`;
        return `<tr>${renderValidationCell(r.id)}${renderValidationCell(r.name)}${renderValidationCell(r.email)}${renderValidationCell(r.phone)}${renderValidationCell(r.address)}${renderValidationCell(r.country)}${renderValidationCell(r.dateOfBirth)}${renderValidationCell(r.taxNumber)}${renderValidationCell(r.iban)}${renderValidationCell(r.ibanOwner)}<td>${r.ibanValid === 'Ja' ? '✅' : '❌'}</td>${renderValidationCell(r.status)}<td><button type="button" class="secondary validation-reminder-btn" data-advisor-id="${escapeHtml(r.id || '')}">Erinnerung senden</button><div class="settings-hint">${escapeHtml(missing.join(', ') || 'keine fehlenden Felder')}</div><div class="settings-hint">${historyHtml}</div></td></tr>`;
      }).join('');

    function rebuildValidationTreeIndex() {
      validationTreeById = new Map();
      validationTreeChildrenByParent = new Map();
      validationTreeRowsCache.forEach(row => {
        const id = String(row.id || '').trim();
        if (!id) return;
        validationTreeById.set(id, row);
        const parentId = String(row.parentId || '').trim();
        if (!validationTreeChildrenByParent.has(parentId)) validationTreeChildrenByParent.set(parentId, []);
        validationTreeChildrenByParent.get(parentId).push(id);
      });
    }

    function validationTreeRootIds() {
      const roots = [];
      validationTreeRowsCache.forEach(row => {
        const id = String(row.id || '').trim();
        const parentId = String(row.parentId || '').trim();
        if (!id) return;
        if (!parentId || !validationTreeById.has(parentId)) roots.push(id);
      });
      return [...new Set(roots)];
    }

    function renderValidationTreeTable() {
      const status = document.getElementById('validationTreeStatus');
      const body = document.getElementById('validationTreeBody');
      if (!status || !body) return;

      const rows = [];
      const roots = validationTreeRootIds();
      const appendNode = (id, level) => {
        const row = validationTreeById.get(id);
        if (!row) return;
        const children = validationTreeChildrenByParent.get(id) || [];
        const isExpanded = validationTreeExpanded.has(id);
        const indentPx = Math.max(0, level) * 18;
        const toggleBtn = children.length ? `<button type="button" class="tree-toggle" data-node-id="${escapeHtml(id)}">${isExpanded ? '▾' : '▸'}</button>` : '<span class="tree-indent" style="width:26px"></span>';
        rows.push(`<tr><td>${escapeHtml(row.id || '')}</td><td>${escapeHtml(row.parentId || '')}</td><td>${escapeHtml(row.level || '0')}</td><td class="tree-name"><span class="tree-indent" style="width:${indentPx}px"></span>${toggleBtn}${escapeHtml(row.name || '')}</td><td>${escapeHtml(row.email || '')}</td><td>${escapeHtml(row.status || '')}</td><td>${escapeHtml(row.childrenCount || String(children.length))}</td></tr>`);
        if (children.length && isExpanded) children.forEach(childId => appendNode(childId, level + 1));
      };
      roots.forEach(id => appendNode(id, 0));

      body.innerHTML = rows.join('');
      body.querySelectorAll('.tree-toggle').forEach(btn => btn.addEventListener('click', () => {
        const nodeId = String(btn.dataset.nodeId || '');
        if (!nodeId) return;
        if (validationTreeExpanded.has(nodeId)) validationTreeExpanded.delete(nodeId);
        else validationTreeExpanded.add(nodeId);
        renderValidationTreeTable();
      }));

      status.textContent = `${rows.length} sichtbare von ${validationTreeRowsCache.length} Knoten.`;
      const table = body.closest('table');
      ensureResizableColumns(table || document);
      applyTableFilterAndSort(table);
      updateEmptyTablesVisibility(document);
    }

    function createHelpTabAndPanel() {
      const panels = document.getElementById('panels');

      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.id = 'help-panel';
      panel.innerHTML = `
        <h2>Hilfe</h2>
        <p class="status" id="helpStatus">Lade Dokumentation…</p>
        <div id="helpDoc" class="help-doc"></div>
      `;
      panels.appendChild(panel);

    function renderHelpAccordion(markdownText) {
      const box = document.getElementById('helpDoc');
      if (!box) return;
      const text = String(markdownText || '').trim();
      if (!text) {
        box.textContent = 'Keine Dokumentation vorhanden.';
        return;
      }
      const parts = text.split(/\n##\s+/g);
      const first = parts.shift() || '';
      const sections = parts.map((p, idx) => {
        const lines = p.split('\n');
        const title = lines.shift();
        const body = lines.join('\n').trim();
        return { title: (title || `Abschnitt ${idx + 1}`).trim(), body };
      });
      const intro = first.replace(/^#.*\n?/, '').trim();
      box.innerHTML = `<div class="help-sections">${intro ? `<div class="help-section-body">${escapeHtml(intro)}</div>` : ''}${sections.map((section, i) => `<details ${i < 2 ? 'open' : ''}><summary>${escapeHtml(section.title)}</summary><div class="help-section-body">${escapeHtml(section.body)}</div></details>`).join('')}</div>`;
    }

    async function loadHelpDocumentation() {
      const status = document.getElementById('helpStatus');
      const box = document.getElementById('helpDoc');
      if (!status || !box) return;
      try {
        const data = await apiGet('/api/help');
        status.textContent = data.title || 'Hilfe';
        renderHelpAccordion(data.content || '');
      } catch (error) {
        status.textContent = `Dokumentation konnte nicht geladen werden: ${error.message}`;
        box.textContent = '';

    function getTableState(table) {
      if (!tableInteractionState.has(table)) {
        tableInteractionState.set(table, { sortCol: null, sortDirection: 'asc', filters: new Map() });
      }
      return tableInteractionState.get(table);
    }

    function cellValue(row, colIndex) {
      const cell = row && row.cells ? row.cells[colIndex] : null;
      return (cell?.textContent || '').trim();
    }

    function compareValues(a, b) {
      const na = Number.parseFloat(a.replace(',', '.'));
      const nb = Number.parseFloat(b.replace(',', '.'));
      if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
      return a.localeCompare(b, 'de', { sensitivity: 'base', numeric: true });
    }

    function updateTableHeaderStates(table) {
      const state = getTableState(table);
      const headers = table.querySelectorAll('thead th');
      headers.forEach((th, idx) => {
        th.classList.toggle('sort-active', state.sortCol === idx);
        const filterSet = state.filters.get(idx);
        th.classList.toggle('filter-active', !!(filterSet && filterSet.size));
      });
    }

    function applyTableFilterAndSort(table) {
      if (!table) return;
      const tbody = table.tBodies && table.tBodies[0];
      if (!tbody) return;
      const state = getTableState(table);
      const rows = [...tbody.rows];

      rows.forEach(row => {
        let visible = true;
        state.filters.forEach((allowedValues, colIndex) => {
          if (!visible || !allowedValues || !allowedValues.size) return;
          if (!allowedValues.has(cellValue(row, colIndex))) visible = false;
        });
        row.style.display = visible ? '' : 'none';
      });

      if (state.sortCol !== null) {
        const dir = state.sortDirection === 'asc' ? 1 : -1;
        rows.sort((ra, rb) => compareValues(cellValue(ra, state.sortCol), cellValue(rb, state.sortCol)) * dir);
        rows.forEach(row => tbody.appendChild(row));
      }
      updateTableHeaderStates(table);
    }

    function closeTableFilterMenu() {
      if (tableFilterMenuEl) {
        tableFilterMenuEl.remove();
        tableFilterMenuEl = null;
      }
    }

    function openTableFilterMenu(evt, th) {
      const table = th.closest('table');
      const tbody = table?.tBodies?.[0];
      if (!table || !tbody) return;
      const colIndex = th.cellIndex;
      if (colIndex < 0) return;
      evt.preventDefault();
      closeTableFilterMenu();

      const state = getTableState(table);
      const rows = [...tbody.rows];
      const rowsAfterOtherFilters = rows.filter(row => {
        let visible = true;
        state.filters.forEach((allowedValues, idx) => {
          if (idx === colIndex || !allowedValues || !allowedValues.size || !visible) return;
          if (!allowedValues.has(cellValue(row, idx))) visible = false;
        });
        return visible;
      });
      const valueCounts = new Map();
      rowsAfterOtherFilters.forEach(row => {
        const val = cellValue(row, colIndex);
        valueCounts.set(val, (valueCounts.get(val) || 0) + 1);
      });
      const allValues = [...valueCounts.keys()].sort((a, b) => compareValues(a, b));
      const selected = state.filters.get(colIndex) || new Set(allValues);

      tableFilterMenuEl = document.createElement('div');
      tableFilterMenuEl.className = 'table-filter-menu';
      tableFilterMenuEl.innerHTML = `
        <h4>Filter: ${escapeHtml((th.textContent || '').trim())}</h4>
        <div class="table-filter-actions">
          <button type="button" data-action="all">Alle</button>
          <button type="button" data-action="none">Keine</button>
          <button type="button" data-action="clear">Filter löschen</button>
          <button type="button" data-action="apply">Anwenden</button>
        </div>
        <div class="table-filter-options">
          ${allValues.map(v => `<label><input type="checkbox" value="${encodeURIComponent(v)}" ${selected.has(v) ? 'checked' : ''}/> <span>${escapeHtml(v || '(leer)')} (${valueCounts.get(v) || 0})</span></label>`).join('')}
        </div>
      `;
      document.body.appendChild(tableFilterMenuEl);
      tableFilterMenuEl.style.left = `${Math.min(window.innerWidth - 300, evt.clientX)}px`;
      tableFilterMenuEl.style.top = `${Math.min(window.innerHeight - 440, evt.clientY)}px`;

      const setAll = (checked) => tableFilterMenuEl.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = checked);

      tableFilterMenuEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'all') setAll(true);
        if (action === 'none') setAll(false);
        if (action === 'clear') {
          state.filters.delete(colIndex);
          applyTableFilterAndSort(table);
          closeTableFilterMenu();
          return;
        }
        if (action === 'apply') {
          const checked = [...tableFilterMenuEl.querySelectorAll('input[type="checkbox"]:checked')].map(cb => decodeURIComponent(cb.value));
          if (!checked.length || checked.length === allValues.length) state.filters.delete(colIndex);
          else state.filters.set(colIndex, new Set(checked));
          applyTableFilterAndSort(table);
          closeTableFilterMenu();
        }
      });
    }

    function prepareTableForResize(table) {
      if (!table || table.dataset.resizePrepared === '1') return;
      const headers = table.querySelectorAll('thead th');
      headers.forEach(th => {
        const w = th.getBoundingClientRect().width;
        if (w > 0) th.style.width = `${Math.round(w)}px`;
      });
      table.style.tableLayout = 'fixed';
      table.dataset.resizePrepared = '1';
    }

    function ensureResizableColumns(root = document) {
      root.querySelectorAll('table thead th').forEach(th => {
        if (th.querySelector('.col-resizer')) return;
        th.style.position = th.style.position || 'relative';
        const handle = document.createElement('span');
        handle.className = 'col-resizer';
        handle.title = 'Spaltenbreite ändern';
        th.appendChild(handle);
      });
    }

    function wireTableInteractions() {
      let activeResize = null;

      document.addEventListener('mousedown', (evt) => {
        const handle = evt.target.closest('.col-resizer');
        if (!handle) return;
        const th = handle.closest('th');
        const table = th?.closest('table');
        if (!th || !table) return;
        evt.preventDefault();
        evt.stopPropagation();
        prepareTableForResize(table);
        th.classList.add('resizing');
        activeResize = { th, startX: evt.clientX, startWidth: th.getBoundingClientRect().width };
      });

      document.addEventListener('mousemove', (evt) => {
        if (!activeResize) return;
        const delta = evt.clientX - activeResize.startX;
        const next = Math.max(70, Math.round(activeResize.startWidth + delta));
        activeResize.th.style.width = `${next}px`;
      });

      document.addEventListener('mouseup', () => {
        if (!activeResize) return;
        activeResize.th.classList.remove('resizing');
        activeResize = null;
      });

      document.addEventListener('click', (evt) => {
        const th = evt.target.closest('th');
        if (!th) {
          if (!evt.target.closest('.table-filter-menu')) closeTableFilterMenu();
          return;
        }
        if (evt.button !== 0) return;
        const table = th.closest('table');
        const tbody = table?.tBodies?.[0];
        if (!table || !tbody) return;
        if (evt.target.closest('.col-resizer')) return;
        if (th.querySelector('input,button,select') || th.dataset.nosort === 'true') return;
        if (th.cellIndex < 0) return;

        const state = getTableState(table);
        if (state.sortCol === th.cellIndex) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
        else {
          state.sortCol = th.cellIndex;
          state.sortDirection = 'asc';
        }
        applyTableFilterAndSort(table);
      });

      document.addEventListener('contextmenu', (evt) => {
        const th = evt.target.closest('th');
        if (!th) return;
        if (th.dataset.nofilter === 'true' || th.querySelector('input,button,select')) return;
        openTableFilterMenu(evt, th);
      });

      document.addEventListener('keydown', (evt) => { if (evt.key === 'Escape') closeTableFilterMenu(); });

      const observer = new MutationObserver(() => ensureResizableColumns());
      observer.observe(document.body, { childList: true, subtree: true });
    }

    function sortCommissionsChronologically(values) {
      const list = Array.isArray(values) ? values.filter(Boolean) : [];
      const unique = [...new Set(list)];
      return unique.sort((a, b) => {
        const an = Number(a), bn = Number(b);
        if (!Number.isNaN(an) && !Number.isNaN(bn)) return an - bn;
        return a.localeCompare(b, "de", { sensitivity: "base" });
      });
    }

    function sortCommissionsNewestFirst(values) {
      return sortCommissionsChronologically(values).reverse();
    }

    function renderCommissionHistoryEditor(history, historyLabels) {
      const box = document.getElementById('commissionHistoryEditor');
      if (!box) return;
      const list = sortCommissionsChronologically(history);
      const MAX_VISIBLE = 10;
      const showAll = list.length <= MAX_VISIBLE;

      const pillHtml = (value) => {
        const label = (historyLabels && historyLabels[value]) || value;
        return `<span class="pill">${label}<button type="button" data-remove-commission="${value}">x</button></span>`;
      };

      if (showAll) {
        box.innerHTML = list.map(pillHtml).join('');
      } else {
        const visiblePills = list.slice(-MAX_VISIBLE).map(pillHtml).join('');
        const hiddenPills = list.slice(0, -MAX_VISIBLE).map(pillHtml).join('');
        const remaining = list.length - MAX_VISIBLE;
        box.innerHTML = visiblePills +
          `<div id="pillOverflow" style="display:none;flex-wrap:wrap;gap:8px;">${hiddenPills}</div>` +
          `<button type="button" class="secondary" id="pillToggleBtn" style="font-size:12px;padding:5px 12px;">Alle anzeigen (${remaining} weitere)</button>`;

        const toggleBtn = document.getElementById('pillToggleBtn');
        const overflow = document.getElementById('pillOverflow');
        if (toggleBtn && overflow) {
          toggleBtn.addEventListener('click', function() {
            const isHidden = overflow.style.display === 'none';
            overflow.style.display = isHidden ? 'flex' : 'none';
            toggleBtn.textContent = isHidden ? 'Einklappen' : `Alle anzeigen (${remaining} weitere)`;
          });
        }
      }

      box.querySelectorAll('button[data-remove-commission]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const commission = btn.getAttribute('data-remove-commission') || '';
          if (!commission) return;
          await removeCommissionFromHistory(commission);
        });
      });
    }

    function updateCommissionSelect(history, activeValue, historyLabels) {
      const fill = (id) => {
        const select = document.getElementById(id);
        if (!select) return;
        const list = sortCommissionsNewestFirst(history);
        const current = activeValue || '';
        const unique = sortCommissionsNewestFirst([...list, current]);
        select.innerHTML = unique.map(value => `<option value="${value}">${(historyLabels && historyLabels[value]) || value}</option>`).join('');
        if (current) select.value = current;
      };
      fill('lastImportedSelect');
      fill('analyticsSinceSelect');
    }

          advisorName: row.name || '',

          missingFields: missing.join('\n'),
          recipientMode: getEmailRecipientMode()

        if (status) status.textContent = `${data.message || 'Erinnerung versendet.'} Empfänger: ${data.toEmail || '-'}`;

    async function exportSelectedInvoiceDetailsPdfs() {
      const status = document.getElementById('pollStatus');
      const filesBox = document.getElementById('exportedFiles');
      const rows = tableState.rows.filter(row => tableState.selected.has(rowKey(row)));
      const paymentIds = [...new Set(rows.map(row => row.paymentId).filter(Boolean))];

      if (paymentIds.length === 0) {
        status.textContent = 'Bitte selektiere mindestens eine Zeile mit gültiger Payment-ID.';
        return;
      }

      if (shouldSendEmails() && getEmailRecipientMode() === 'advisor') {
        const confirmed = window.confirm('Die E-Mails werden an die jeweiligen Beraterinnen gesendet. Möchtest du fortfahren?');
        if (!confirmed) {
          status.textContent = 'Export abgebrochen.';
          return;
        }
      }

      const createdFiles = [];
      const failed = [];
      const mixed = [];
      const counts = { gutschrift: 0, rechnung: 0 };

      for (let i = 0; i < paymentIds.length; i++) {
        const paymentId = paymentIds[i];
        status.textContent = `Erzeuge Beleg ${i + 1}/${paymentIds.length} für Payment-ID ${paymentId} ...`;
        try {
          const data = await postInvoiceDetailsExport(paymentId);
          if (data.documentKind && counts[data.documentKind] !== undefined) counts[data.documentKind]++;
          if (data.file) createdFiles.push(data.file);
          if (data.jsonFile) createdFiles.push(data.jsonFile);
          if (data.zugferdFile) createdFiles.push(data.zugferdFile);
          if (data.eInvoiceViewPdfFile) createdFiles.push(data.eInvoiceViewPdfFile);
        } catch (error) {
          if (error.code === 'MIXED_PERIOD') mixed.push({ paymentId, details: error.details || {} });
          else failed.push({ paymentId, message: error.message });
        }
      }

      renderInvoiceExportResult(filesBox, createdFiles, failed, mixed);

      const summary = describeCreatedDocuments(counts, createdFiles.length);
      const mixedSuffix = mixed.length > 0 ? `, ${mixed.length} gemischte(r) Zahllauf/Zahlläufe offen` : '';
      if (failed.length === 0) {
        status.textContent = `${summary}${mixedSuffix}.`;
      } else if (createdFiles.length === 0) {
        status.textContent = `Keine Belege erstellt. Fehler bei ${failed.length} Payment-ID(s)${mixedSuffix}.`;
      } else {
        status.textContent = `${summary}, ${failed.length} Fehler${mixedSuffix}.`;
      }
    }

    function describeCreatedDocuments(counts, fileCount) {
      const parts = [];
      if (counts.gutschrift > 0) parts.push(`${counts.gutschrift} Gutschrift(en)`);
      if (counts.rechnung > 0) parts.push(`${counts.rechnung} Rechnung(en)`);
      if (parts.length === 0) return fileCount > 0 ? `${fileCount} Datei(en) erstellt` : 'Keine Belege erstellt';
      return `${parts.join(' und ')} erstellt`;
    }

    function renderInvoiceExportResult(filesBox, createdFiles, failed, mixed) {
      if (!filesBox) return;
      const okHtml = createdFiles.length > 0
        ? `<strong>Exportierte Dateien (PDF, JSON, ZUGFeRD):</strong><br>${createdFiles.map(f => `<code>${escapeHtml(String(f))}</code>`).join('<br>')}`
        : '<strong>Keine Belege erstellt.</strong>';
      const failHtml = failed.length > 0
        ? `<br><br><strong>Fehler:</strong><br>${failed.map(f => `<code>${escapeHtml(String(f.paymentId))}</code>: ${escapeHtml(String(f.message))}`).join('<br>')}`
        : '';
      const mixedHtml = mixed.length > 0
        ? `<br><br><strong class="text-warn">⚠ Gemischte Zahlläufe (kein Beleg erzeugt, keine Belegnummer vergeben): ${mixed.length}</strong><br>`
          + mixed.map(m => {
              const d = m.details || {};
              return `<code>${escapeHtml(String(m.paymentId))}</code> · ${escapeHtml(String(d.periodLabel || '-'))}`
                + ` · vor Stichtag: ${d.beforeCutoffCount ?? 0} / ${formatEuroAmount(d.beforeCutoffAmount)}`
                + ` · ab Stichtag: ${d.fromCutoffCount ?? 0} / ${formatEuroAmount(d.fromCutoffAmount)}`
                + ` <button type="button" class="secondary mixed-decide-btn" data-payment-id="${escapeHtml(String(m.paymentId))}">Entscheiden</button>`;
            }).join('<br>')
        : '';
      filesBox.innerHTML = `${okHtml}${failHtml}${mixedHtml}`;
      filesBox.querySelectorAll('.mixed-decide-btn').forEach(btn => {
        const paymentId = btn.dataset.paymentId;
        const entry = mixed.find(m => String(m.paymentId) === String(paymentId));
        btn.addEventListener('click', async () => {
          const choice = await askMixedPeriodDecision(entry ? entry.details : { paymentId });
          if (choice) await loadInvoiceDetailsPdf(paymentId, choice);
        });
      });

    async function loadInvoiceDetailsPdf(paymentId, documentKind) {
      const status = document.getElementById('pollStatus');
      try {
        if (!documentKind && shouldSendEmails() && getEmailRecipientMode() === 'advisor') {
          const confirmed = window.confirm('Die E-Mail wird an die Beraterinnen-Adresse gesendet. Möchtest du fortfahren?');
          if (!confirmed) {
            status.textContent = 'Aktion abgebrochen.';
            return;
          }
        }
        let data;
        try {
          data = await postInvoiceDetailsExport(paymentId, documentKind);
        } catch (error) {
          if (error.code !== 'MIXED_PERIOD') throw error;
          const choice = await askMixedPeriodDecision(error.details || { paymentId });
          if (!choice) {
            status.textContent = 'Abgebrochen – es wurde kein Beleg erzeugt und keine Belegnummer vergeben.';
            return;
          }
          data = await postInvoiceDetailsExport(paymentId, choice);
        }
        await loadMailLog();
        renderTable();
        const label = `${data.documentKindLabel || 'Beleg'} ${data.documentNumber || ''}`.trim();
        const hints = [];
        if (data.documentKind === 'rechnung') hints.push('Altfall vor Stichtag');
        if (data.documentKindSource === 'paymentCreatedAt') hints.push('Dokumentart aus dem Zahllauf-Datum abgeleitet');
        if (data.documentKindOverridden) hints.push('Dokumentart manuell gewählt');
        const hintText = hints.length ? ` (${hints.join('; ')})` : '';
        status.textContent = data.opened
          ? `${label} erstellt und geöffnet: ${data.file}${hintText}`
          : `${label} erstellt: ${data.file}${data.jsonFile ? ' | ' + data.jsonFile : ''}${data.zugferdFile ? ' | ' + data.zugferdFile : ''}${data.eInvoiceViewPdfFile ? ' | ' + data.eInvoiceViewPdfFile : ''}${data.openMessage ? ' (' + data.openMessage + ')' : ''}${hintText}`;
      } catch (error) {
        status.textContent = `Fehler bei der Belegerstellung: ${error.message}`;
      }
    }
